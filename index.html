<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melody Lab</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/controls.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <div class="app-container">
        
        <header class="app-header">
            <h1>Melody Lab</h1>
            <span class="version">v0.7.0</span>
        </header>

        <aside class="sidebar-config">
            <div class="panel-section">
                <h2>Configurações Base</h2>
                
                <div class="control-group">
                    <label for="personality-select">Personalidade</label>
                    <select id="personality-select">
                        <option value="neutral">Neutra</option>
                        <option value="dark">Dark</option>
                        <option value="emotional">Emocional</option>
                        <option value="catchy">Catchy</option>
                        <option value="energetic">Energética</option>
                        <option value="experimental">Experimental</option>
                        <option value="cinematic">Cinemática</option>
                        <option value="minimalist">Minimalista</option>
                    </select>
                    <small id="personality-desc" class="help-text">Comportamento equilibrado.</small>
                </div>

                <div class="control-group">
                    <label for="key-select">Tonalidade</label>
                    <select id="key-select">
                        <option value="C">Dó (C)</option>
                        <option value="G">Sol (G)</option>
                        <option value="D">Ré (D)</option>
                        <option value="A">Lá (A)</option>
                        <option value="E">Mi (E)</option>
                        <option value="F">Fá (F)</option>
                        <option value="Bb">Si Bemol (Bb)</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="scale-select">Escala</label>
                    <select id="scale-select">
                        <option value="major">Maior</option>
                        <option value="minor_natural">Menor Natural</option>
                        <option value="minor_harmonic">Menor Harmônica</option>
                        <option value="minor_melodic">Menor Melódica</option>
                        <option value="pentatonic_major">Pentatônica Maior</option>
                        <option value="pentatonic_minor">Pentatônica Menor</option>
                        <option value="blues">Blues</option>
                        <option value="dorian">Dórica</option>
                        <option value="phrygian">Frígia</option>
                        <option value="lydian">Lídia</option>
                        <option value="mixolydian">Mixolídia</option>
                        <option value="aeolian">Eólia</option>
                        <option value="locrian">Lócria</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="bpm-input">Tempo (BPM): <span id="bpm-value">120</span></label>
                    <input type="range" id="bpm-input" min="60" max="200" value="120">
                </div>

                <div class="control-group">
                    <label for="bars-select">Tamanho</label>
                    <select id="bars-select">
                        <option value="1">1 Compasso</option>
                        <option value="2">2 Compassos</option>
                        <option value="4">4 Compassos</option>
                        <option value="8" selected>8 Compassos</option>
                        <option value="16">16 Compassos</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="creativity-input">Criatividade: <span id="creativity-value">50%</span></label>
                    <input type="range" id="creativity-input" min="0" max="100" value="50">
                </div>
                <div class="control-group">
                    <label for="repetition-input">Repetição: <span id="repetition-value">50%</span></label>
                    <input type="range" id="repetition-input" min="0" max="100" value="50">
                </div>
                <div class="control-group">
                    <label for="complexity-input">Complexidade: <span id="complexity-value">50%</span></label>
                    <input type="range" id="complexity-input" min="0" max="100" value="50">
                </div>

                <button id="btn-generate" class="btn-primary">Gerar Melodia Base</button>
            </div>

            <hr class="sidebar-divider">

            <div class="panel-section">
                <h2>Harmonia & Baixo</h2>
                <div class="control-group">
                    <label for="harmony-mode">Modo de Harmonia</label>
                    <select id="harmony-mode">
                        <option value="off">Desligada</option>
                        <option value="auto">Automática</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="bass-mode">Comportamento do Baixo</label>
                    <select id="bass-mode">
                        <option value="off">Desligado</option>
                        <option value="fundamental">Fundamental</option>
                        <option value="fundamental_fifth">Fundamental + Quinta</option>
                        <option value="bassline">Bassline Simples</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Progressão Atual:</label>
                    <div id="progression-display" class="progression-box">-</div>
                </div>
                <button id="btn-regen-harmony" class="btn-secondary" disabled>Regenerar Apenas Harmonia</button>
            </div>

            <hr class="sidebar-divider">

            <div class="panel-section">
                <h2>Mutações</h2>
                <div class="control-group">
                    <label for="mutation-type">Tipo de Mutação</label>
                    <select id="mutation-type">
                        <option value="alter_notes">Alterar Notas</option>
                        <option value="alter_rhythm">Alterar Ritmo</option>
                        <option value="alter_end">Alterar Final</option>
                        <option value="alter_start">Alterar Início</option>
                        <option value="increase_tension">Aumentar Tensão</option>
                        <option value="simplify">Simplificar</option>
                        <option value="increase_complexity">Aumentar Complexidade</option>
                        <option value="make_catchy">Deixar Mais Marcante</option>
                        <option value="make_experimental">Deixar Mais Experimental</option>
                        <option value="transpose">Transpor Tonalidade</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="mutation-intensity">Intensidade: <span id="mutation-intensity-value">50%</span></label>
                    <input type="range" id="mutation-intensity" min="0" max="100" value="50">
                </div>
                <button id="btn-mutate" class="btn-secondary" disabled>Aplicar Mutação</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="info-panel">
                <div class="info-header">
                    <h2>Informações e Histórico</h2>
                    <div class="history-controls">
                        <button id="btn-undo" class="btn-toolbar" disabled>Desfazer</button>
                        <button id="btn-redo" class="btn-toolbar" disabled>Refazer</button>
                    </div>
                </div>
                <p id="melody-status">Nenhuma melodia gerada no momento. Ajuste os parâmetros e clique em "Gerar Melodia Base".</p>
            </div>

            <div class="piano-roll-container">
                <div class="piano-roll-toolbar">
                    <div class="toolbar-group">
                        <label for="pr-snap">Grade:</label>
                        <select id="pr-snap">
                            <option value="1.0">1/4</option>
                            <option value="0.5">1/8</option>
                            <option value="0.25" selected>1/16</option>
                        </select>
                    </div>
                    <div class="toolbar-group">
                        <label>Zoom X:</label>
                        <button id="btn-zoom-x-out" class="btn-toolbar">-</button>
                        <button id="btn-zoom-x-in" class="btn-toolbar">+</button>
                    </div>
                    <div class="toolbar-group">
                        <label>Zoom Y:</label>
                        <button id="btn-zoom-y-out" class="btn-toolbar">-</button>
                        <button id="btn-zoom-y-in" class="btn-toolbar">+</button>
                    </div>
                </div>
                
                <div class="piano-roll-viewport" id="pr-viewport">
                    <div id="pr-sizer"></div>
                    <canvas id="pr-canvas"></canvas>
                </div>
            </div>
        </main>

        <footer class="bottom-bar">
            <div class="transport-controls">
                <button id="btn-play" class="btn-control" disabled>Reproduzir</button>
                <button id="btn-pause" class="btn-control" disabled>Pausar</button>
                <button id="btn-stop" class="btn-control" disabled>Parar</button>
                <label class="checkbox-label">
                    <input type="checkbox" id="check-loop"> Repetir
                </label>
            </div>
            
            <div class="mixer-controls">
                <div class="mixer-channel">
                    <label class="checkbox-label">
                        <input type="checkbox" id="check-synth" checked> Synth Saw
                    </label>
                    <input type="range" id="vol-synth" min="0" max="100" value="80">
                </div>
                <div class="mixer-channel">
                    <label class="checkbox-label">
                        <input type="checkbox" id="check-bass" checked> Bass
                    </label>
                    <input type="range" id="vol-bass" min="0" max="100" value="40">
                </div>
            </div>

            <div class="export-controls">
                <button id="btn-export-midi" class="btn-secondary" disabled>Baixar MIDI</button>
            </div>
        </footer>

    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
